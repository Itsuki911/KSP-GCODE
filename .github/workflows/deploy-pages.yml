name: Deploy Simulation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Working Folder_Adachi/simulator/output/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp "Working Folder_Adachi/simulator/output/"*.html _site/
          touch _site/.nojekyll
          python3 -c '
          import re, pathlib
          p = pathlib.Path("_site/index.html")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r" \| <a href=\"[^\"]+(_summary\.png|_trace\.csv)\">(PNG|CSV)</a>", "", txt)
          p.write_text(txt, encoding="utf-8")
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
