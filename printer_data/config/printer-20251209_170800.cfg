[include mainsail.cfg]
[mcu]
#####################################################################
# Obtain definition by "ls -l /dev/serial/by-id/"
#####################################################################
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_20000D0005504E5238363120-if00


[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: -273.15
max_temp: 999

[temperature_sensor host_temp]
sensor_type: temperature_host
min_temp: -273.15
max_temp: 999

[printer]
kinematics: cartesian
max_velocity: 125
max_accel: 1000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 6.0



[delayed_gcode turnFanOn]
initial_duration: 1.0
gcode: 
  turnOnFan 

  
[gcode_macro TURNTABLE_TEST]
gcode:
        SET_KINEMATIC_POSITION X=0 Y=0 Z=0
        G90
        G1 X100 F500
        M18

[gcode_macro turnOnFan]
gcode: 
  SET_FAN_SPEED FAN=fan SPEED=1.0

  

[fan_generic fan]
pin:PC6



#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PB13

dir_pin: PB12                                                     
enable_pin: !PB14
rotation_distance: 360
gear_ratio: 125:20
microsteps: 64
full_steps_per_rotation: 200   


endstop_pin: ^PC0
position_endstop: 0
position_max: 360
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
interpolate: False
run_current: 1.5       

sense_resistor: 0.110
stealthchop_threshold: 9999999999999                                          
diag_pin: ^PC1  													
driver_SGTHRS: 255                                                 

[stepper_y]
step_pin: PB10
dir_pin: PB2                                                        
enable_pin: !PB11
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200   

endstop_pin: ^!PC1


position_endstop: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
interpolate: False
run_current: 1.5          


sense_resistor: 0.110
stealthchop_threshold: 99999999                                            
diag_pin: ^PC1   												   
driver_SGTHRS: 255                                               
#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5                                                    
enable_pin: !PB1
rotation_distance: 8                                             
microsteps: 64

endstop_pin: ^!PC2
#position_endstop: 51
position_max: 60
position_min: 0
homing_speed: 20
second_homing_speed: 10.0
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
interpolate: False
## For OMC (StepperOnline) 17LS13-0404E-200G 0.4A 
run_current: 1.0
## For LDO-42STH25-1004CL200E 1.0A
#run_current: 0.37
sense_resistor: 0.110
stealthchop_threshold: 99999999                                          


[servo ballValve]
pin: PA1

maximum_servo_angle: 270
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025



[idle_timeout]
timeout: 1800


[gcode_macro _HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT_RATIO = 1.0 %} # by default we are dropping the motor current during homing. you can adjust this value if you are having trouble with skipping while homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_Y}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F1200
    
    # Wait for StallGuard registers to clear
    M400
    G90
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT_RATIO = 1.0 %} # by default we are dropping the motor current during homing. you can adjust this value if you are having trouble with skipping while homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT_RATIO * RUN_CURRENT_Y}

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F1200

    # Wait for StallGuard registers to clear
    M400
    G90
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro BALL_VALVE]
description: Set ball valve opening (0–100%)
gcode:
  {% set p = params.P|default(0)|float %}


  {% if p < 0 %}
    {% set p = 0 %}
  {% elif p > 100 %}
    {% set p = 100 %}
  {% endif %}


  {% set angle = 0.0 + p * 150.0 / 100.0 %}

  SET_SERVO SERVO=ballValve ANGLE={angle}


[gcode_macro BALL_VALVE_OPEN]
description: Fully open ball valve (35°)
gcode:
  SET_SERVO SERVO=ballValve ANGLE=45

[gcode_macro BALL_VALVE_CLOSED]
description: Fully close ball valve (0°)
gcode:
  SET_SERVO SERVO=ballValve ANGLE=0


[gcode_macro _HOME_Z]
gcode:
    G90
    G28 Z
    G1 Z30

[force_move]
enable_force_move: true


[neopixel my_neopixel]
pin: PA8
chain_count: 120

[delayed_gcode my_delayed_gcode]
gcode:
  LED_COOLING

initial_duration: 3.0 





[gcode_macro LED_OFF]
gcode:
    SET_LED LED=my_neopixel RED=0 GREEN=0 BLUE=0

[gcode_macro LED_HEATING]
gcode:
    SET_LED LED=my_neopixel RED=0.05 GREEN=0 BLUE=0

[gcode_macro LED_PRINTING]
gcode:
    SET_LED LED=my_neopixel RED=0.25 GREEN=0.25 BLUE=0.25

[gcode_macro LED_COOLING]
gcode:
    SET_LED LED=my_neopixel RED=0 GREEN=1.0 BLUE=1.0

